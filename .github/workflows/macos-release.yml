name: "🍎 macOS app"

# A v* tag publishes Grant Matcher as a signed, notarized disk image on the tag's GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Two runs for one tag would race on the release and its assets.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Builds, signs and notarizes with a read-only token. Only the release job below can write.
  build:
    name: "🏗️ build Grant Matcher"
    # Apple silicon. numpy's wheels set the app's minimum to macOS 14, whatever the runner is.
    runs-on: macos-26
    # A notarytool wait of up to 30 minutes, plus the build.
    timeout-minutes: 60
    env:
      # The app carries the CA file path of the Python that builds it, and the runner's own Python reads one from inside its own install, which is not part of macOS. So the tests and the build both run on uv's Python.
      UV_MANAGED_PYTHON: "1"
    defaults:
      run:
        working-directory: NIH Extractor
    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the tagged commit can be checked against origin/main.
          fetch-depth: 0
      - name: "🐍 Set up uv"
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          # No cache: a release build must not start from files an earlier run left behind.
          enable-cache: false
      - name: "🔎 Check the tag, the version and the release secrets"
        env:
          HAS_SECRETS: ${{ secrets.MACOS_CERT_P12 != '' && secrets.MACOS_CERT_PASSWORD != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_KEY_P8 != '' && secrets.SPARKLE_ED_KEY != '' }}
        run: |
          version=$(uv run --locked python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME differs from the pyproject.toml version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points at $(git rev-parse HEAD), which is not on main"
            exit 1
          fi
          if [ "$HAS_SECRETS" != true ]; then
            echo "::error::MACOS_CERT_P12, MACOS_CERT_PASSWORD, the three APPLE_API_* secrets and SPARKLE_ED_KEY are all required to publish a signed, notarized disk image with its update feed. See docs/macos-app.md."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: "🧪 Run the test suite"
        run: uv run --locked pytest -q -W error::DeprecationWarning
      - name: "🔏 Import the Developer ID certificate"
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::${KEYCHAIN_PASSWORD}"
          P12="$RUNNER_TEMP/cert.p12"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          # The runner's bash is 3.2, so no mapfile.
          EXISTING=()
          while IFS= read -r k; do EXISTING+=("$k"); done < <(security list-keychains -d user | sed 's/^ *"\(.*\)"$/\1/')
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING[@]}"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          rm -f "$P12"
          identity=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERT_P12 holds no Developer ID Application identity"
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: "🏗️ Build, sign and notarize the disk image"
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: macos/build.sh
      # The bytes users get, after build.sh's staging copy.
      - name: "🔍 Check the disk image and the app inside it"
        run: |
          dmg="macos/dist/Grant Matcher.dmg"
          xcrun stapler validate "$dmg"
          mount=$(mktemp -d)
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "$mount" "$dmg"
          # || true, or a busy detach would fail a good build after it notarized.
          trap 'hdiutil detach -quiet -force "$mount" || true' EXIT
          codesign --verify --deep --strict "$mount/Grant Matcher.app"
          actual=$(plutil -extract CFBundleShortVersionString raw "$mount/Grant Matcher.app/Contents/Info.plist")
          [ "$actual" = "$VERSION" ] || {
            echo "the app says version '$actual', expected $VERSION" >&2
            exit 1
          }
      - name: "📦 Name the disk image and write its checksum"
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          asset="Grant-Matcher-$VERSION-arm64.dmg"
          cp "macos/dist/Grant Matcher.dmg" "$RUNNER_TEMP/release/$asset"
          (cd "$RUNNER_TEMP/release" && shasum -a 256 "$asset" > "$asset.sha256")
      # The signature covers the file's bytes, and the enclosure URL carries the renamed copy's name.
      - name: "📰 Write and check the update feed"
        env:
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
        run: |
          asset="$RUNNER_TEMP/release/Grant-Matcher-$VERSION-arm64.dmg"
          macos/make-appcast.sh "$asset" "$VERSION" > "$RUNNER_TEMP/release/appcast.xml"
          # A wrong SPARKLE_ED_KEY stops here, because every installed app would refuse the update.
          macos/verify-appcast.sh "macos/dist/Grant Matcher.app" "$asset" "$RUNNER_TEMP/release/appcast.xml"
      - name: "⬆️ Hand the disk image to the release job"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  release:
    name: "🚀 publish the release"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: "⬇️ Fetch the disk image"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dmg
          path: dist
      - name: "🚀 Upload the disk image to the release"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # A rebuild is not byte-identical, so a published asset is never replaced.
          if existing=$(gh release view "$TAG" --json assets -q '.assets[].name'); then
            for f in dist/*; do
              if grep -qxF "$(basename "$f")" <<< "$existing"; then
                echo "::error::release $TAG already has $(basename "$f"); delete the asset by hand to republish"
                exit 1
              fi
            done
            gh release upload "$TAG" dist/*
          else
            gh release create "$TAG" dist/* --generate-notes
          fi
      # A newer release with no appcast.xml would silence every installed app's scheduled check.
      - name: "🔎 Check that installed apps can see the release"
        env:
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          feed="https://github.com/$GH_REPO/releases/latest/download/appcast.xml"
          for _ in 1 2 3 4 5 6; do
            if curl -fsSL "$feed" | grep -qF "<sparkle:version>${TAG#v}</sparkle:version>"; then exit 0; fi
            sleep 10
          done
          echo "::error::$feed does not offer ${TAG#v}. Installed apps will not see this release."
          exit 1
