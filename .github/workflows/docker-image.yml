name: "🐳 Docker image"

# Publishes the dashboard and CLI image to GitHub Container Registry, so that
# `docker compose pull` fetches it instead of building.
#
#   ghcr.io/<owner>/nih-grant-matcher   NIH Extractor/Dockerfile (linux/amd64 + arm64)
#
# A push to main that touches an image input builds and pushes, and so does a
# release tag. A pull request that touches one builds without pushing, and so
# does a manual run from another branch. A weekly run on main rebuilds and pushes,
# so that `latest` takes the week's Debian security fixes.
#
# Every build is scanned before it is pushed. A HIGH or CRITICAL vulnerability
# that has a fix fails the job. One with no fix yet does not.
#
# Tags: `latest` on main, `sha-<short>` on every build but the weekly one, and on a release tag
# `vX.Y.Z` both `X.Y.Z` and `X.Y`. The weekly run moves `latest` only, so that a
# `sha-<short>` tag keeps naming one build.
# The first push creates the package as private. Make it public in the package
# settings once, or every pull needs a token.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: &image-inputs
      - 'NIH Extractor/Dockerfile'
      - 'NIH Extractor/.dockerignore'
      - 'NIH Extractor/pyproject.toml'
      - 'NIH Extractor/uv.lock'
      - 'NIH Extractor/streamlit_app.py'
      - 'NIH Extractor/nih_grant_matcher/**'
      - .github/workflows/docker-image.yml
  pull_request:
    paths: *image-inputs
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Only main and release tags publish. A pull request or a manual run from another branch builds without pushing.
  PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  publish:
    name: "🐳 publish nih-grant-matcher"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push the image to GHCR
    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The hadolint action splits a path at a space, so it cannot read "NIH Extractor/Dockerfile".
      # The image reads the file on standard input instead. Renovate moves the pin (renovate.json).
      - name: "🔍 Lint Dockerfile"
        env:
          HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
        run: docker run --rm -i "$HADOLINT_IMAGE" hadolint --failure-threshold warning - < "NIH Extractor/Dockerfile"
      - name: "🧰 Set up QEMU"
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: "🧰 Set up Buildx"
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The Dockerfile reruns its package upgrade when this value changes, which is once a week.
      - name: "🗓️ Compute the weekly refresh stamp"
        id: week
        run: echo "stamp=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: "🏗️ Build for the scan"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: NIH Extractor
          load: true
          tags: nih-grant-matcher:scan
          build-args: APT_REFRESH=${{ steps.week.outputs.stamp }}
          cache-from: type=gha
      # Trivy runs as a pinned image, like hadolint, and reads the build as a file, so it needs no Docker socket.
      # Renovate moves the pin (renovate.json).
      - name: "🛡️ Scan for fixable vulnerabilities"
        env:
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
        run: |
          docker save nih-grant-matcher:scan -o "$RUNNER_TEMP/image.tar"
          docker run --rm -v "$RUNNER_TEMP/image.tar:/image.tar:ro" "$TRIVY_IMAGE" image --input /image.tar --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      - name: "🔐 Log in to GHCR"
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "🏷️ Compute tags and labels"
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/nih-grant-matcher
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable=${{ github.event_name != 'schedule' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: "🚀 Build and push"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: NIH Extractor
          platforms: linux/amd64,linux/arm64
          build-args: APT_REFRESH=${{ steps.week.outputs.stamp }}
          push: ${{ env.PUBLISH == 'true' }}
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
