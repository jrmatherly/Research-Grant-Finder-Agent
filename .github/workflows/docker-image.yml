name: "🐳 Docker image"

# Publishes the dashboard and CLI image to GitHub Container Registry, so that
# `docker compose pull` fetches it instead of building.
#
#   ghcr.io/<owner>/nih-grant-matcher   NIH Extractor/Dockerfile (linux/amd64 + arm64)
#
# A push to main that touches an image input builds and pushes. A pull request
# that touches one builds without pushing.
#
# Tags: `latest` on main, `sha-<short>` on every build, and on a release tag
# `vX.Y.Z` both `X.Y.Z` and `X.Y`.
# The first push creates the package as private. Make it public in the package
# settings once, or every pull needs a token.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: &image-inputs
      - 'NIH Extractor/Dockerfile'
      - 'NIH Extractor/.dockerignore'
      - 'NIH Extractor/requirements.lock'
      - 'NIH Extractor/streamlit_app.py'
      - 'NIH Extractor/nih_grant_matcher/**'
      - .github/workflows/docker-image.yml
  pull_request:
    paths: *image-inputs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  publish:
    name: "🐳 publish nih-grant-matcher"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "🔍 Lint Dockerfile"
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: NIH Extractor/Dockerfile
          failure-threshold: warning
      - name: "🧰 Set up QEMU"
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: "🧰 Set up Buildx"
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: "🔐 Log in to GHCR"
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "🏷️ Compute tags and labels"
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/nih-grant-matcher
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: "🚀 Build and push"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: NIH Extractor
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
