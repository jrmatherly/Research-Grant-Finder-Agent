services:
  app:
    build: ./NIH Extractor
    # Published by .github/workflows/docker-image.yml. `docker compose pull` fetches it and `--build` builds it here.
    image: ghcr.io/jrmatherly/nih-grant-matcher:latest
    ports:
      # Loopback only: the dashboard has no login and takes file paths as input.
      - "127.0.0.1:8501:8501"
    volumes:
      - ./NIH Extractor/data:/app/data
      - ./NIH Extractor/outputs:/app/outputs
      - ./NIH Extractor/digests:/app/digests
    restart: unless-stopped
