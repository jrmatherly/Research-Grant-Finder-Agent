[project]
name = "nih-grant-matcher"
version = "0.2.0"
description = "Find NIH/HHS grant opportunities relevant to ML and data analysis expertise."
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.50",
  "pandas>=2.0",
]

[dependency-groups]
dev = ["pytest>=8"]
macos = [
    "pyinstaller>=6.22.3 ; sys_platform == 'darwin'",
    "pywebview>=6.2.1 ; sys_platform == 'darwin'",
]

[tool.uv]
# An application run from this directory, not a library: uv installs the dependencies and does not build the project.
package = false
required-version = ">=0.13"
# Matches minimumReleaseAge in renovate.json.
exclude-newer = "1 week"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
